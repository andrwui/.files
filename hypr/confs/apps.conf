exec = hyprpaper
exec = ags quit
exec = ags quit
exec = hyprctl setcursor Breeze_Light 24
exec = tmux start-server

exec = ags run
exec = hyprpaper

# APP BINDINGS
bind = $mainMod, RETURN, exec, kitty -e fish -c tmux
bind = $mainMod, space, exec, $menu
bind = $mainMod , backslash, exec, hyprshot -z -m region
bind = $mainMod_SHIFT, backslash, exec, hyprshot -z -m output
bind = $mainMod, W, exec, $browser
bind = $mainMod_Shift, W, exec, firefox
bind = $mainMod, N, exec, $fileManager
bind = $mainMod&Shift&Control, L, exec, $swaylock
bind = $mainMod, c, exec, goclip
