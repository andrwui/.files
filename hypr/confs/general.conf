general { 
    gaps_in = 4
    gaps_out = 6

    border_size = 1

    col.active_border = rgba(ffffffff) 
    col.inactive_border = rgba(00000000)

    allow_tearing = true

    layout = dwindle
}
decoration {
    rounding = 5

    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = false
        size = 8
        passes = 1
        
        vibrancy = 0
    }
}

animations {
    bezier = myBezier,.16,.77,.63,.96 

    animation = windows, 1, 1.5, myBezier, slide 
    animation = border, 1, 1.5, myBezier
    animation = workspaces, 1, 2, myBezier, slide
}


misc { 
    disable_hyprland_logo = true 
}


input {

    kb_layout = us,es
    kb_options = compose:caps
    repeat_rate = 25
    repeat_delay = 200

    follow_mouse = 2

    sensitivity = 0 # -1.0 - 1.0, 0 means no modification.
    
    touchpad {
        natural_scroll = true
        scroll_factor = 0.5

    }
}

# CONFIG PER DEVICE
device {
    name = synps/2-synaptics-touchpad
    sensitivity = 0.4
}

xwayland {
  force_zero_scaling = true
}
