general { 
  gaps_in = 4
  gaps_out = 6

  border_size = 2

 col.active_border = 0xffd8d8d8
    col.inactive_border = 0xff080808

  allow_tearing = true

  layout = dwindle
}

decoration {

  rounding = 5
  active_opacity = 1.0
  inactive_opacity = 1.0

  blur {
    enabled = false
      size = 8
      passes = 1
      vibrancy = 0
  }
}

animations {

  bezier = myBezier, 0.16, 0.77, 0.63, 0.96 

  animation = fade, 0
  animation = windowsOut, 0, 3, myBezier, popin
  animation = windowsIn, 1, 3, myBezier, popin
  animation = windowsMove, 1, 3, myBezier, slide
  animation = border, 1, 3, myBezier
  animation = workspaces, 1, 3, myBezier, slide
  animation = layers, 0, 3, myBezier, slide
}


misc { 
  disable_hyprland_logo = true 
  focus_on_activate = 1
  middle_click_paste = false
}


input {

  kb_layout = us,es
  kb_options = compose:caps
  repeat_rate = 25
  repeat_delay = 200

  follow_mouse = 1
  float_switch_override_focus = 2
  mouse_refocus = 0

  sensitivity = 0.5
  accel_profile = flat,
  force_no_accel = true

  touchpad {
    natural_scroll = true
      scroll_factor = 0.5

  }
}

device {

  name = synps/2-synaptics-touchpad
  sensitivity = 0.4

}

xwayland {

  force_zero_scaling = true

}
